<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="How akm works: the agent sends key names, akm injects values into the command, and redacted output returns" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><title>How akm works: the agent sends key names, akm injects values into the command, and redacted output returns</title><rect x="1" y="1" width="898" height="268" rx="14" fill="#14171A" stroke="#2B3036"/><rect x="30" y="36" width="230" height="112" rx="12" fill="#1B1F23" stroke="#7D848C" stroke-width="1.5"/><text x="145.0" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EDE4">Agent</text><text x="145.0" y="96" text-anchor="middle" font-size="12.5" fill="#C9C3B8">Claude Code, Codex,</text><text x="145.0" y="117" text-anchor="middle" font-size="12.5" fill="#C9C3B8">Gemini CLI, your scripts</text><rect x="335" y="36" width="230" height="112" rx="12" fill="#1B1F23" stroke="#D9A441" stroke-width="1.5"/><text x="450.0" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EDE4">akm</text><text x="450.0" y="96" text-anchor="middle" font-size="12.5" fill="#C9C3B8">reads the named keys</text><text x="450.0" y="117" text-anchor="middle" font-size="12.5" fill="#C9C3B8">from macOS Keychain</text><rect x="640" y="36" width="230" height="112" rx="12" fill="#1B1F23" stroke="#8FB39A" stroke-width="1.5"/><text x="755.0" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F2EDE4">Your command</text><text x="755.0" y="96" text-anchor="middle" font-size="12.5" fill="#C9C3B8">gets them as env vars</text><text x="755.0" y="117" text-anchor="middle" font-size="12.5" fill="#C9C3B8">or on stdin</text><line x1="262" y1="80" x2="333" y2="80" stroke="#D9A441" stroke-width="2"/><path d="M333 80l-6 -5v10z" fill="#D9A441"/><text x="297.5" y="71" text-anchor="middle" font-size="12" fill="#D9A441">key names</text><line x1="567" y1="80" x2="638" y2="80" stroke="#8FB39A" stroke-width="2"/><path d="M638 80l-6 -5v10z" fill="#8FB39A"/><text x="602.5" y="71" text-anchor="middle" font-size="12" fill="#8FB39A">values</text><line x1="638" y1="124" x2="567" y2="124" stroke="#C9C3B8" stroke-width="2"/><path d="M567 124l6 -5v10z" fill="#C9C3B8"/><text x="602.5" y="115" text-anchor="middle" font-size="12" fill="#C9C3B8">output</text><line x1="333" y1="124" x2="262" y2="124" stroke="#C9C3B8" stroke-width="2"/><path d="M262 124l6 -5v10z" fill="#C9C3B8"/><text x="297.5" y="115" text-anchor="middle" font-size="12" fill="#C9C3B8">redacted</text><text x="450.0" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EDE4">The agent sends names and gets results. Values stay out of its context.</text><text x="450.0" y="226" text-anchor="middle" font-size="12.5" fill="#7D848C">No account · no server · no prompts · exit codes pass through · audit log of every run</text></svg>
