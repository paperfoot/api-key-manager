<svg xmlns="http://www.w3.org/2000/svg" width="922" height="243" viewBox="0 0 922 243" role="img" aria-label="Without akm the agent reads keys from .env; with akm it runs the command by key name" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><title>Without akm the agent reads keys from .env; with akm it runs the command by key name</title><text x="224.0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E07A5F">✗  The agent reads .env</text><text x="698.0" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8FB39A">✓  The agent runs akm</text><rect x="1" y="34" width="446" height="207" rx="12" fill="#14171A" stroke="#2B3036"/><path d="M1 46a12 12 0 0 1 12-12h422a12 12 0 0 1 12 12v22h-446z" fill="#1B1F23"/><line x1="1" y1="68" x2="447" y2="68" stroke="#2B3036"/><circle cx="19" cy="51.0" r="5.5" fill="#E5675F"/><circle cx="37" cy="51.0" r="5.5" fill="#E0B54A"/><circle cx="55" cy="51.0" r="5.5" fill="#6DBA6A"/><text x="224.0" y="55.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7D848C">without akm</text><text x="23" y="104" xml:space="preserve"><tspan fill="#D9A441" font-weight="700">$ </tspan><tspan fill="#F2EDE4" font-weight="600">cat .env</tspan></text><text x="23" y="127" xml:space="preserve"><tspan fill="#C9C3B8">OPENAI_API_KEY=</tspan><tspan fill="#E07A5F" font-weight="600">sk-proj-9fK…</tspan></text><text x="23" y="150" xml:space="preserve"><tspan fill="#C9C3B8">STRIPE_SECRET_KEY=</tspan><tspan fill="#E07A5F" font-weight="600">sk_live_…</tspan></text><text x="23" y="173" xml:space="preserve"><tspan fill="#C9C3B8"></tspan></text><text x="23" y="196" xml:space="preserve"><tspan fill="#7D848C"># Both values are now in the transcript,</tspan></text><text x="23" y="219" xml:space="preserve"><tspan fill="#7D848C"># the provider&#x27;s logs and every summary.</tspan></text><rect x="475" y="34" width="446" height="207" rx="12" fill="#14171A" stroke="#2B3036"/><path d="M475 46a12 12 0 0 1 12-12h422a12 12 0 0 1 12 12v22h-446z" fill="#1B1F23"/><line x1="475" y1="68" x2="921" y2="68" stroke="#2B3036"/><circle cx="493" cy="51.0" r="5.5" fill="#E5675F"/><circle cx="511" cy="51.0" r="5.5" fill="#E0B54A"/><circle cx="529" cy="51.0" r="5.5" fill="#6DBA6A"/><text x="698.0" y="55.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7D848C">with akm</text><text x="497" y="104" xml:space="preserve"><tspan fill="#D9A441" font-weight="700">$ </tspan><tspan fill="#F2EDE4" font-weight="600">akm run --only OPENAI_API_KEY \</tspan></text><text x="497" y="127" xml:space="preserve"><tspan fill="#F2EDE4" font-weight="600">    -- npm test</tspan></text><text x="497" y="150" xml:space="preserve"><tspan fill="#8FB39A" font-weight="700">✓ </tspan><tspan fill="#C9C3B8">42 passed</tspan></text><text x="497" y="173" xml:space="preserve"><tspan fill="#C9C3B8"></tspan></text><text x="497" y="196" xml:space="preserve"><tspan fill="#7D848C"># The agent handled a name. The value went</tspan></text><text x="497" y="219" xml:space="preserve"><tspan fill="#7D848C"># from Keychain straight into the test run.</tspan></text></svg>
