<svg xmlns="http://www.w3.org/2000/svg" width="820" height="301" viewBox="0 0 820 301" role="img" aria-label="An AI agent using akm list, akm run and akm stdin; the key is redacted in output" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><title>An AI agent using akm list, akm run and akm stdin; the key is redacted in output</title><rect x="1" y="1" width="818" height="299" rx="12" fill="#14171A" stroke="#2B3036"/><path d="M1 13a12 12 0 0 1 12-12h794a12 12 0 0 1 12 12v22h-818z" fill="#1B1F23"/><line x1="1" y1="35" x2="819" y2="35" stroke="#2B3036"/><circle cx="19" cy="18.0" r="5.5" fill="#E5675F"/><circle cx="37" cy="18.0" r="5.5" fill="#E0B54A"/><circle cx="55" cy="18.0" r="5.5" fill="#6DBA6A"/><text x="410.0" y="22.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7D848C">agent session — ~/Projects/app</text><text x="23" y="71" xml:space="preserve"><tspan fill="#7D848C"># The agent needs OpenAI for an eval. It looks up a name, not a value.</tspan></text><text x="23" y="94" xml:space="preserve"><tspan fill="#D9A441" font-weight="700">$ </tspan><tspan fill="#F2EDE4" font-weight="600">akm list --names-only | grep OPENAI</tspan></text><text x="23" y="117" xml:space="preserve"><tspan fill="#C9C3B8">OPENAI_API_KEY</tspan></text><text x="23" y="140" xml:space="preserve"><tspan fill="#D9A441" font-weight="700">$ </tspan><tspan fill="#F2EDE4" font-weight="600">akm run --only OPENAI_API_KEY -- python eval.py</tspan></text><text x="23" y="163" xml:space="preserve"><tspan fill="#C9C3B8">client ready, key=</tspan><tspan fill="#8FB39A" font-weight="600">[REDACTED:OPENAI_API_KEY]</tspan></text><text x="23" y="186" xml:space="preserve"><tspan fill="#C9C3B8">eval: 42/42 passed</tspan></text><text x="23" y="209" xml:space="preserve"><tspan fill="#C9C3B8"></tspan></text><text x="23" y="232" xml:space="preserve"><tspan fill="#7D848C"># Same key, published to CI. Piped straight in, never printed.</tspan></text><text x="23" y="255" xml:space="preserve"><tspan fill="#D9A441" font-weight="700">$ </tspan><tspan fill="#F2EDE4" font-weight="600">akm stdin OPENAI_API_KEY -- gh secret set OPENAI_API_KEY</tspan></text><text x="23" y="278" xml:space="preserve"><tspan fill="#8FB39A" font-weight="700">✓ </tspan><tspan fill="#C9C3B8">Set Actions secret OPENAI_API_KEY for paperfoot/app</tspan></text></svg>
