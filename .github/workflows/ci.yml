name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Smoke test
        run: |
          ./target/release/akm --version
          ./target/release/akm agent-info --command run | python3 -c 'import json,sys; assert list(json.load(sys.stdin)["data"]["commands"]) == ["run"]'
      - name: Package executable
        run: |
          arch=$(uname -m)
          tar -czf "akm-${arch}-apple-darwin.tar.gz" -C target/release akm
          shasum -a 256 "akm-${arch}-apple-darwin.tar.gz" > "akm-${arch}-apple-darwin.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: akm-${{ runner.arch }}-apple-darwin
          path: akm-*.tar.gz*
  msrv:
    name: Rust 1.85
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked
